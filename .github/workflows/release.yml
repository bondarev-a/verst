name: Пакет Ubuntu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    name: Собрать и выложить deb
    runs-on: ubuntu-24.04
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Заголовки GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev dpkg-dev

      - name: Пакет
        run: ./packaging/install_ubuntu.sh --deb

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          asset="packaging/out/verst_${version}_amd64.deb"
          tag="v${version}"
          body=$(awk -v ver="$version" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' release_notes.md)
          if [ -z "$(printf "%s" "$body" | tr -d "[:space:]")" ]; then
            echo "В release_notes.md нет раздела ## ${version}" >&2
            exit 1
          fi
          notes=$(mktemp)
          {
            printf "%s\n" "$body"
            echo
            echo "Пакет для Ubuntu 24.04 и новее, архитектура amd64. Компилятор не нужен."
            echo
            echo "sudo apt install ./verst_${version}_amd64.deb"
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" "$asset" --title "Verst ${version}" --notes-file "$notes"
          fi
