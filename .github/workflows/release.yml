name: Пакет Ubuntu

on:
  push:
    branches: [main]

# Права на запись — только у задачи, которая выкладывает релиз.
permissions:
  contents: read

jobs:
  package:
    name: Собрать и выложить deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Действия закреплены по коммиту, а не по тегу или ветке: тег можно
      # перевесить на чужой код, коммит — нет.
      - name: Код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Заголовки GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev dpkg-dev

      - name: Пакет
        run: ./packaging/install_ubuntu.sh --deb

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          asset="packaging/out/verst_${version}_amd64.deb"
          tag="v${version}"
          body=$(awk -v ver="$version" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' release_notes.md)
          if [ -z "$(printf "%s" "$body" | tr -d "[:space:]")" ]; then
            echo "В release_notes.md нет раздела ## ${version}" >&2
            exit 1
          fi
          notes=$(mktemp)
          {
            printf "%s\n" "$body"
            echo
            echo "Пакет для Ubuntu 24.04 и новее, архитектура amd64. Компилятор не нужен."
            echo
            echo "sudo apt install ./verst_${version}_amd64.deb"
          } > "$notes"
          # Контрольная сумма пакета для проверки после скачивания.
          sums="packaging/out/SHA256SUMS"
          (cd packaging/out && sha256sum "verst_${version}_amd64.deb") > "$sums"
          echo "SHA256: $(cut -d' ' -f1 "$sums")" >> "$notes"
          # Выпущенный пакет не перезаписывается: раньше push без смены
          # версии молча подменял .deb в уже опубликованном релизе.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Релиз ${tag} уже есть, пакет не перезаписан. Чтобы выпустить изменения, поднимите версию."
          else
            gh release create "$tag" "$asset" "$sums" --title "Verst ${version}" --notes-file "$notes"
          fi
